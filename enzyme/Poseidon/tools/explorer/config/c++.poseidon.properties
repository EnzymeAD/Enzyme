compilers=&poseidon:&clang
defaultCompiler=clang@LLVM@-poseidon
tools=llvm-mca:nm:poseidon-report:poseidon-source:poseidon-diff:poseidon-fpcore
demangler=c++filt
objdumper=objdump
supportsBinary=true
needsMulti=false

group.poseidon.compilers=clang@LLVM@-poseidon
group.poseidon.groupName=Clang + Poseidon
group.poseidon.compilerType=clang
group.poseidon.intelAsm=-mllvm --x86-asm-syntax=intel
group.poseidon.supportsExecute=true
group.poseidon.options=-fno-discard-value-names -Rpass=poseidon -Rpass-analysis=poseidon
compiler.clang@LLVM@-poseidon.exe=/opt/compiler-explorer/poseidon/clang++
compiler.clang@LLVM@-poseidon.name=clang @LLVM@ + Poseidon
compiler.clang@LLVM@-poseidon.semver=@LLVM@
compiler.clang@LLVM@-poseidon.envVars=POSEIDON_CE_CLANG=/usr/bin/clang++-@LLVM@:POSEIDON_CE_ROOT=/opt/compiler-explorer/poseidon

group.clang.compilers=clang@LLVM@
group.clang.groupName=Clang
group.clang.compilerType=clang
group.clang.intelAsm=-mllvm --x86-asm-syntax=intel
group.clang.supportsExecute=true
group.clang.options=-I/opt/compiler-explorer/poseidon/include
compiler.clang@LLVM@.exe=/usr/bin/clang++-@LLVM@
compiler.clang@LLVM@.name=clang @LLVM@
compiler.clang@LLVM@.semver=@LLVM@

tools.llvm-mca.name=llvm-mca
tools.llvm-mca.exe=/usr/lib/llvm-@LLVM@/bin/llvm-mca
tools.llvm-mca.type=postcompilation
tools.llvm-mca.class=llvm-mca-tool
tools.llvm-mca.stdinHint=disabled

tools.nm.name=nm
tools.nm.exe=/usr/bin/nm
tools.nm.type=postcompilation
tools.nm.class=nm-tool
tools.nm.stdinHint=disabled

tools.poseidon-report.name=Poseidon report
tools.poseidon-report.exe=/opt/compiler-explorer/poseidon/poseidon-explain-ce.sh
tools.poseidon-report.type=postcompilation
tools.poseidon-report.class=testing-tool
tools.poseidon-report.options=report
tools.poseidon-report.exclude=clang@LLVM@$
tools.poseidon-report.stdinHint=disabled

tools.poseidon-source.name=Poseidon source
tools.poseidon-source.exe=/opt/compiler-explorer/poseidon/poseidon-explain-ce.sh
tools.poseidon-source.type=postcompilation
tools.poseidon-source.class=miri-tool
tools.poseidon-source.options=source
tools.poseidon-source.exclude=clang@LLVM@$
tools.poseidon-source.stdinHint=disabled
tools.poseidon-source.languageId=cppp

tools.poseidon-diff.name=Poseidon diff
tools.poseidon-diff.exe=/opt/compiler-explorer/poseidon/poseidon-explain-ce.sh
tools.poseidon-diff.type=postcompilation
tools.poseidon-diff.class=miri-tool
tools.poseidon-diff.options=diff
tools.poseidon-diff.exclude=clang@LLVM@$
tools.poseidon-diff.stdinHint=disabled

tools.poseidon-fpcore.name=Poseidon FPCore
tools.poseidon-fpcore.exe=/opt/compiler-explorer/poseidon/poseidon-explain-ce.sh
tools.poseidon-fpcore.type=postcompilation
tools.poseidon-fpcore.class=miri-tool
tools.poseidon-fpcore.options=fpcore
tools.poseidon-fpcore.exclude=clang@LLVM@$
tools.poseidon-fpcore.stdinHint=disabled
