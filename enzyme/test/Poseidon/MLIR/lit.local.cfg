# poseidon-mlir-opt's tests. The tool is built next to poseidon-clang, and only
# with -DPOSEIDON_MLIR=ON; without it these tests are unsupported.
import os

config.suffixes = ['.mlir']

poseidon_bin = os.path.dirname(dict(config.substitutions)['%poseidon_clang'])
poseidon_mlir_opt = os.path.join(poseidon_bin, 'poseidon-mlir-opt')
config.substitutions.append(('%poseidon_mlir_opt', poseidon_mlir_opt))
if os.path.isfile(poseidon_mlir_opt):
    config.available_features.add('poseidon-mlir')
