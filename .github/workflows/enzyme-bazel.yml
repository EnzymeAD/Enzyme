name: Bazel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/enzyme-bazel.yml'
      - 'enzyme/Enzyme/**'
      - 'enzyme/includes/**'
      - 'enzyme/test/**'
      - 'enzyme/tools/**'
      - 'enzyme/BUILD'
      - 'enzyme/WORKSPACE'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/enzyme-bazel.yml'
      - 'enzyme/Enzyme/**'
      - 'enzyme/includes/**'
      - 'enzyme/test/**'
      - 'enzyme/tools/**'
      - 'enzyme/BUILD'
      - 'enzyme/WORKSPACE'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    name: Enzyme Bazel Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux-x86-n2-32
        build:
          - Release
        llbuild:
          - Release
    timeout-minutes: 500

    container:
      image: ghcr.io/enzymead/reactant-docker-images@sha256:91e1edb7a7c869d5a70db06e417f22907be0e67ca86641d48adcea221fedc674

    steps:
      - name: Install Python dependencies
        run: python -m pip install lit
      - name: Checkout Enzyme repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          repository: 'llvm/llvm-project'
          path: 'llvm-project'
      - uses: bazel-contrib/setup-bazel@0.14.0
        name: Set up Bazel
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.build }}-${{ matrix.llbuild }}
          repository-cache: true
          bazelisk-version: 1.x
      - name: Build Enzyme
        run: |
          cd enzyme
          bazel build --color=yes :EnzymeStatic :enzymemlir-opt
      - name: Test Enzyme
        run: |
          cd enzyme
          bazel test --color=yes --test_output=errors ...
