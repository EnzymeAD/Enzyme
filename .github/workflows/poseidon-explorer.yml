# Publishes what the Enzyme Compiler Explorer needs to offer Poseidon: the pass
# plugin and the Enzyme plugin it co-loads, the profiling runtime, the header,
# a Herbie build, the examples' Herbie results, calibrate/microbm_cpu.py, and
# tools/explorer/poseidon-ce.sh, which is the executable the explorer calls as
# its "compiler". No cost model ships: the machine that runs the explorer
# measures its own once with calibrate/microbm_cpu.py. The tarball goes to the
# `nightly-poseidon` release; the explorer-builder polls this workflow on the
# `poseidon` branch and unpacks it, and tools/explorer/Dockerfile builds a
# standalone explorer from it.
name: Poseidon Explorer

on:
  push:
    branches:
      - poseidon
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    name: Poseidon Explorer LLVM 21
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      LLVM: 21

    steps:
    - name: Install dependencies
      run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key|sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/`lsb_release -c | cut -f2`/ llvm-toolchain-`lsb_release -c | cut -f2`-$LLVM main" || true
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ llvm-$LLVM-dev clang-$LLVM libclang-$LLVM-dev libzstd-dev libmpfr-dev
          sudo python3 -m pip install --upgrade pip lit numpy llvmlite

    - uses: Bogdanp/setup-racket@0094a9d8bd157633293a2210f373bb542687fa6d # v1.11
      with:
        version: '8.15'
        variant: 'CS'

    - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - name: Configure
      run: |
          cmake -G Ninja -S enzyme -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-$LLVM/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT=$(which lit) \
            -DENZYME_POSEIDON=ON

    - name: Build
      run: cmake --build build

    - name: Package
      run: |
          set -e
          P=poseidon-explorer-llvm$LLVM
          EX=enzyme/Poseidon/tools/explorer/examples/c++/Poseidon_cancellation.cpp
          # The lit fixture's prices only run the examples here: a host Herbie
          # search does not read the cost model, so their results hold under
          # the explorer's own, and the tarball carries none.
          export POSEIDON_CE_COST_MODEL=$PWD/enzyme/test/Poseidon/Inputs/cm_cpu_native.csv
          enzyme/Poseidon/tools/explorer/package.sh build - $P
          tar czf $P.tar.gz $P
          test ! -e $P/cost_models/cm_x86-64_explorer.csv
          # The wrapper must answer the explorer's version probe, compile the
          # explorer's example from the unpacked tree, and refuse to compile
          # without a cost model before anything is published.
          export POSEIDON_CE_ROOT=$PWD/$P POSEIDON_CE_CLANG=/usr/bin/clang++-$LLVM
          $P/poseidon-ce.sh --version
          $P/poseidon-ce.sh -g -O2 -o smoke $EX 2>&1 | tee smoke.log
          grep -q 'Applying solution' smoke.log
          ./smoke
          ! env -u POSEIDON_CE_COST_MODEL $P/poseidon-ce.sh -O2 -o none $EX 2>none.log
          grep -q 'no cost model at' none.log

    - name: Publish
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
          if gh release view nightly-poseidon >/dev/null 2>&1; then
            gh release edit nightly-poseidon --title "Poseidon Explorer" --notes "Latest build of the Poseidon branch for the Enzyme Compiler Explorer." --target ${{ github.sha }}
          else
            gh release create nightly-poseidon --title "Poseidon Explorer" --notes "Latest build of the Poseidon branch for the Enzyme Compiler Explorer." --target ${{ github.sha }}
          fi
          gh release upload nightly-poseidon poseidon-explorer-llvm$LLVM.tar.gz --clobber
