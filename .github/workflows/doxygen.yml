name: Build and deploy Doxygen to Scripts

on:
  # Triggers the workflow on pushes to the "main" branch, i.e., PR merges
  push:
    branches:
      - main
    paths:
      - '.github/workflows/doxygen.yml'
      - '**/*.md'
      - 'enzyme/doxygen.cfg'
      - 'enzyme/Enzyme/**'
  # Triggers the workflow on pushes to open pull requests with documentation changes
  pull_request:
    paths:
      - '.github/workflows/doxygen.yml'
      - '**/*.md'
      - 'enzyme/doxygen.cfg'
      - 'enzyme/Enzyme/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# Write permissions are not needed for all jobs in this workflow
permissions: {}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Enzyme repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: mattnotmitt/doxygen-action@b84fe17600245bb5db3d6c247cc274ea98c15a3b # v1.12.0
        with:
          working-directory: 'enzyme/'
          doxyfile-path: 'doxygen.cfg'

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: enzyme/doxygen/html

  deploy-docs:
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build-docs
    # Only deploy the docs upon merging into main
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 #v5
