# Builds Enzyme with the Poseidon plugin against an apt LLVM and runs
# check-poseidon. No CUDA or ROCm is installed, so the tests that need them are
# unsupported; check-poseidon-integration launches CUDA kernels, which a
# GitHub-hosted runner cannot. One job builds Herbie from source as well, to
# check that it builds and that the pass runs it and reads its output.
name: Poseidon CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-linux:
    name: Poseidon CI LLVM ${{ matrix.llvm }} ${{ matrix.build }} ${{ matrix.os }} Herbie ${{ matrix.herbie }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        llvm: ["21", "22"]
        build: ["Release"]
        os: [ubuntu-22.04]
        herbie: ["OFF"]
        include:
          - llvm: "22"
            build: "Release"
            os: ubuntu-22.04
            herbie: "ON"

    timeout-minutes: ${{ matrix.herbie == 'ON' && 40 || 30 }}

    steps:
    - name: Install dependencies
      run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key|sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/`lsb_release -c | cut -f2`/ llvm-toolchain-`lsb_release -c | cut -f2`-${{ matrix.llvm }} main" || true
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc g++ llvm-${{ matrix.llvm }}-dev clang-${{ matrix.llvm }} libclang-${{ matrix.llvm }}-dev lld-${{ matrix.llvm }} libzstd-dev libmpfr-dev
          sudo python3 -m pip install --upgrade pip lit

    # Racket as Herbie's own CI pins it; Rust comes with the runner image.
    - name: Install Racket
      if: matrix.herbie == 'ON'
      run: |
          wget -O /tmp/racket.sh https://download.racket-lang.org/installers/9.3/racket-9.3-x86_64-linux-cs.sh
          sudo sh /tmp/racket.sh --unix-style --dest /usr/local

    - name: Checkout Enzyme repository
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      with:
        persist-credentials: false

    - name: Configure
      run: |
          cmake -G Ninja -S enzyme -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build }} \
            -DLLVM_DIR=/usr/lib/llvm-${{ matrix.llvm }}/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT=`which lit` \
            -DENZYME_POSEIDON=ON \
            -DPOSEIDON_BUILD_HERBIE=${{ matrix.herbie }} \
            -DPOSEIDON_TEST_GPU_ARCH=sm_120

    - name: Build
      run: cmake --build build

    - name: check-poseidon
      run: cmake --build build --target check-poseidon
